name: Insect Project Observations Report

on:
  schedule:
    - cron: '30 7 * * *'  # Run at 7:30 AM UTC every day
  workflow_dispatch:  # Allow manual trigger

jobs:
  observations-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Run Insect Project Observations Report
      env:
        OBSERVATIONS_EMAIL_RECIPIENTS: ${{ secrets.OBSERVATIONS_EMAIL_RECIPIENTS }}
        _OBSERVATION_EMAIL_RECIPIENTS: ${{ secrets._OBSERVATION_EMAIL_RECIPIENTS }}
      run: |
        docker run --rm \
          -e ENVIRONMENT="${{ secrets.ENVIRONMENT }}" \
          -e SENDER_EMAIL="${{ secrets.SENDER_EMAIL }}" \
          -e SENDER_NAME="${{ secrets.SENDER_NAME }}" \
          -e SMTP_DEBUG_LEVEL="${{ secrets.SMTP_DEBUG_LEVEL }}" \
          -e SMTP_HOST="${{ secrets.SMTP_HOST }}" \
          -e SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
          -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
          -e SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}" \
          -e OBSERVATIONS_EMAIL_RECIPIENTS="$OBSERVATIONS_EMAIL_RECIPIENTS" \
          -e _OBSERVATION_EMAIL_RECIPIENTS="$_OBSERVATION_EMAIL_RECIPIENTS" \
          --memory="2g" \
          --cpus="1" \
          ghcr.io/ai-cfia/insect-project:${{ github.ref_name }} \
          observations
