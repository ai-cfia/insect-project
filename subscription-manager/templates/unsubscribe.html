{% extends "base.html" %}

{% block title %}Unsubscribe - Insect Project Reports{% endblock %}

{% block content %}
<div class="header">
    <h1>Unsubscribe from Reports</h1>
    <p>Insect Project Automated Analysis</p>
</div>

<form method="POST" action="{{ url_for('unsubscribe') }}">
    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your.email@inspection.gc.ca" required>
    </div>
    
    <button type="submit" class="btn btn-danger">Unsubscribe</button>
</form>

<div class="actions">
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
</div>

<div class="footer">
    <p>Valid domain: @inspection.gc.ca</p>
    <p>A confirmation email will be sent to verify your unsubscription</p>
</div>
{% endblock %}
